name: Deploy to Self-Hosted Runner

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted]
    environment: deploy

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create .env file
        uses: SpicyPizza/create-envfile@v2.0.3
        with:
          envkey_DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          envkey_SYMBOLS: ${{ secrets.SYMBOLS }}
          envkey_TIMEFRAME: ${{ secrets.TIMEFRAME }}
          envkey_RISK_PERCENT: ${{ secrets.RISK_PERCENT }}

      - name: Deploy with Docker Compose
        run: |
          docker compose down || true
          docker compose up -d --build
          docker image prune -f
